openapi: 3.0.3
info:
  title: Etamid (اعتمد) Mobile API
  version: 1.2.1
  description: |
    عقد الـ API بين الـ Backend (.NET) وتطبيق الموبايل.
    - كل الردود بصيغة موحدة: { success, message, data, errors, meta }
    - اللغة: هيدر Accept-Language (ar | en)
    - التواريخ: ISO 8601 بتوقيت UTC
    - المبالغ: number بالريال السعودي (SAR) بخانتين عشريتين
    - الجوال: بصيغة 05XXXXXXXX
    - الأخطاء: errors[].code ثابت للبرمجة، و message مترجم للعرض
    - الإجراءات المتاحة لكل معاملة تأتي جاهزة في availableActions ولا يحسبها الموبايل
    - [تثبيت العقد 2026-10-29] هذا الملف يعكس الكود الفعلي على main (بعد تنظيف
      Cycle 3). المسارات المعلمة [NOT IMPLEMENTED] غير منفذة في الباك إند ويجب
      ألا يستخدمها الموبايل. المسارات غير المعلمة منفذة فعلا. عند التعارض،
      الكود (Controllers + DTOs) هو مصدر الحقيقة، وليس هذا الملف.
    - [Cycle 3 completion] أضيفت: إلغاء المعاملة، اقتراح/موافقة/رفض/إلغاء التعديل،
      وبحث البائع GET /users/lookup. التعديل قبل القبول فقط (بعد القبول الشروط
      مجمّدة)، وحالة المعاملة تبقى pending_acceptance أثناء التعديل المعلق —
      لا توجد حالة edit_proposed في الكود، والاقتراح المعلق يظهر في pendingEdit.
    - حالات الصفقة الفعلية (snake_case) وأفعال availableActions الفعلية موثقة
      في DealStatus و DealAction أدناه. أي حالة أو فعل خارج هاتين القائمتين
      غير موجود في الكود الحالي.
servers:
  - url: https://mock.etamid.example/api/v1
    description: Mock (Postman/Prism)
  - url: https://staging-api.etamid.example/api/v1
    description: Staging
  - url: https://api.etamid.example/api/v1
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Config
  - name: Auth
  - name: Profile
  - name: Notifications
  - name: Deals
  - name: Wallet
  - name: Disputes
  - name: Support
  - name: Company

paths:
  # ---------------- Config ----------------
  /config:
    get:
      tags: [Config]
      summary: إعدادات التطبيق (لغات، إصدار أدنى، روابط)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AppConfig' }
  /lookups/{type}:
    get:
      tags: [Config]
      summary: قوائم ثابتة للشاشات
      description: |
        types: reject-reasons | dispute-reasons | shipping-companies | banks | duration-units | payment-methods | company-reject-reasons
      security: []
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [reject-reasons, dispute-reasons, shipping-companies, banks, duration-units, payment-methods, company-reject-reasons] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/LookupItem' } }
  /terms/{type}:
    get:
      tags: [Config]
      summary: الشروط والأحكام (منصة، معاملة، شركات)
      security: []
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [platform, deal, company] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Terms' }

  # ---------------- Auth ----------------
  /auth/register/individual:
    post:
      tags: [Auth]
      summary: إنشاء حساب فرد (شاشة signup - individual)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, phone, email, password, acceptTerms]
              properties:
                username: { type: string, example: "ندى الشرقاوي" }
                phone: { type: string, example: "0551234567" }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                acceptTerms: { type: boolean, description: يجب أن تكون true }
      responses:
        "201": { $ref: '#/components/responses/OtpSent' }
        "422": { $ref: '#/components/responses/ValidationError' }
        "409": { $ref: '#/components/responses/Conflict' }
  /auth/register/company:
    post:
      tags: [Auth]
      summary: إنشاء حساب شركة (شاشة signup - companies)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyName, ownerPhone, commercialRegNo, email, password, acceptTerms]
              properties:
                companyName: { type: string }
                ownerPhone: { type: string }
                commercialRegNo: { type: string }
                taxNo: { type: string, nullable: true, description: اختياري }
                email: { type: string, format: email }
                password: { type: string, format: password }
                acceptTerms: { type: boolean }
      responses:
        "201": { $ref: '#/components/responses/OtpSent' }
        "422": { $ref: '#/components/responses/ValidationError' }
        "409": { $ref: '#/components/responses/Conflict' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: تفعيل الحساب بالكود (شاشة verify account)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, minLength: 6, maxLength: 6, example: "123456" }
      responses:
        "200": { $ref: '#/components/responses/AuthTokens' }
        "400":
          description: كود خاطئ أو منتهي (OTP_INVALID | OTP_EXPIRED | OTP_ATTEMPTS_EXCEEDED)
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
  /auth/otp/resend:
    post:
      tags: [Auth]
      summary: إعادة إرسال كود التفعيل (للتسجيل فقط)
      description: |
        للتسجيل فقط، وبـ {phone} فقط — لا يوجد حقل purpose في الكود الفعلي.
        يرجع نجاحا عاما حتى للرقم غير المعروف أو أثناء فترة التهدئة (60 ثانية)
        لمنع تعداد الحسابات. لاستعادة كلمة المرور، استخدم /auth/password/forgot.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        "200": { $ref: '#/components/responses/OtpSent' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: تسجيل الخروج من كل الأجهزة (إلغاء كل جلسات Refresh)
      responses:
        "200": { $ref: '#/components/responses/Ok' }
  /auth/phone/verify:
    post:
      tags: [Auth]
      summary: '[LEGACY] التحقق من رقم الهاتف عبر Firebase — لا يغني عن تفعيل البريد'
      description: |
        مسار قديم متبق في الكود. يعمل فقط لحساب Active وبريد موثق أصلا، ولا
        يفعّل الحساب بدلا من Email OTP. لا تستخدمه في تدفق التسجيل الجديد.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken: { type: string, description: Firebase ID token }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
  /auth/login:
    post:
      tags: [Auth]
      summary: تسجيل الدخول (شاشة login)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string, format: password }
      responses:
        "200": { $ref: '#/components/responses/AuthTokens' }
        "401":
          description: INVALID_CREDENTIALS
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
        "403":
          description: ACCOUNT_NOT_VERIFIED (يجب تفعيل الحساب) أو ACCOUNT_SUSPENDED
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: تجديد التوكن
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200": { $ref: '#/components/responses/AuthTokens' }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: تسجيل الخروج
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
                deviceToken: { type: string, description: لإلغاء إشعارات الجهاز }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: استرداد كلمة المرور - الخطوة 1 (إرسال الكود)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        "200": { $ref: '#/components/responses/OtpSent' }
        "404": { $ref: '#/components/responses/NotFound' }
  /auth/password/verify-otp:
    post:
      tags: [Auth]
      summary: استرداد كلمة المرور - الخطوة 2 (التحقق من الكود)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "200":
          description: يرجع resetToken يُستخدم في الخطوة 3
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          resetToken: { type: string }
        "400": { $ref: '#/components/responses/ValidationError' }
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: استرداد كلمة المرور - الخطوة 3 (كلمة جديدة)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, newPassword, confirmPassword]
              properties:
                resetToken: { type: string }
                newPassword: { type: string, format: password }
                confirmPassword: { type: string, format: password }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
        "422": { $ref: '#/components/responses/ValidationError' }

  # ---------------- Profile ----------------
  /me:
    get:
      tags: [Profile]
      summary: بيانات حسابي (شاشة حسابي)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Profile' }
    put:
      tags: [Profile]
      summary: تعديل بيانات الملف الشخصي
      description: |
        إذا تغيّر البريد، يصبح البريد الجديد غير موثق فورا (EmailVerifiedAt=null)
        ويرسل كود OTP جديد إليه. على الموبايل إرسال المستخدم بعدها إلى تدفق
        التحقق الموجود: POST /auth/otp/verify بـ {phone, code} (أو resend).
        يرجع data: { emailChanged, emailVerificationRequired, otpSent }.
        otpSent=false لا يعني فشل التعديل — يعني أن الكود لم يرسل (تهدئة أو
        SMTP غير مهيأ) ويمكن إعادة الإرسال لاحقا.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                email: { type: string, format: email }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UpdateProfileResult' }
        "422": { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Profile]
      summary: '[NOT IMPLEMENTED] حذف الحساب — غير منفذ في الكود الحالي، لا تستخدمه'
      description: لا يوجد endpoint لحذف الحساب في الباك إند الحالي (الدومين فقط فيه MarkDeleted).
      responses:
        "200": { $ref: '#/components/responses/Ok' }
        "409": { $ref: '#/components/responses/Conflict' }
  /me/password:
    put:
      tags: [Profile]
      summary: تغيير كلمة المرور (الأمان والخصوصية)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
        "422": { $ref: '#/components/responses/ValidationError' }
  /me/language:
    put:
      tags: [Profile]
      summary: تغيير اللغة
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language: { type: string, enum: [ar, en] }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
  /me/avatar:
    post:
      tags: [Profile]
      summary: رفع صورة الملف الشخصي
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
  /me/kyc/nafath/start:
    post:
      tags: [Profile]
      summary: بدء التحقق من الهوية عبر نفاذ
      responses:
        "200":
          description: يرجع رقم التحقق الذي يظهر للمستخدم ليختاره داخل تطبيق نفاذ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          requestId: { type: string }
                          randomNumber: { type: string, example: "42" }
                          expiresInSeconds: { type: integer, example: 120 }
  /me/kyc/nafath/status:
    get:
      tags: [Profile]
      summary: حالة التحقق (Polling كل 3 ثوانٍ)
      parameters:
        - { name: requestId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, enum: [pending, verified, rejected, expired] }
  /me/bank-account:
    get:
      tags: [Profile]
      summary: الحساب البنكي (IBAN مقنّع)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BankAccount' }
    put:
      tags: [Profile]
      summary: إضافة أو تعديل الحساب البنكي (يتحقق من الـ IBAN ويحدد البنك)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holderName, iban]
              properties:
                holderName: { type: string }
                iban: { type: string, example: "SA0380000000608010167519" }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
        "422": { $ref: '#/components/responses/ValidationError' }
  /me/home:
    get:
      tags: [Profile]
      summary: '[NOT IMPLEMENTED] بيانات الشاشة الرئيسية — غير منفذ في الكود الحالي، لا تستخدمه'
      description: لا يوجد مسار /me/home في الباك إند الحالي.
      description: يمكن استدعاؤه كزائر (يرجع walletActivated=false بدون بيانات)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Home' }
  /me/store:
    get:
      tags: [Profile]
      summary: متجري
      responses:
        "200":
          description: OK (أو data=null إذا لم يكن للمستخدم متجر)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          categoryId: { type: integer, nullable: true }
                          category: { type: string, nullable: true }
                          bannerUrl: { type: string, nullable: true }
                          rating: { type: number }
                          successfulDeals: { type: integer }
    put:
      tags: [Profile]
      summary: حفظ بيانات المتجر
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeName]
              properties:
                storeName: { type: string }
                categoryId: { type: integer, nullable: true }
                bannerFileId: { type: string, nullable: true }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
  /me/addresses:
    get:
      tags: [Profile]
      summary: عناويني (بحد أقصى 10 عناوين)
      responses:
        "200": { $ref: '#/components/responses/Ok' }
    post:
      tags: [Profile]
      summary: إضافة عنوان
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientName, recipientPhone, city]
              properties:
                label: { type: string, nullable: true }
                recipientName: { type: string }
                recipientPhone: { type: string }
                city: { type: string }
                district: { type: string, nullable: true }
                street: { type: string, nullable: true }
                buildingNo: { type: string, nullable: true }
                postalCode: { type: string, nullable: true }
                additionalNo: { type: string, nullable: true }
                latitude: { type: number, nullable: true }
                longitude: { type: number, nullable: true }
      responses:
        "201": { $ref: '#/components/responses/Ok' }
  /me/addresses/{id}:
    put:
      tags: [Profile]
      summary: تعديل عنوان
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
    delete:
      tags: [Profile]
      summary: حذف عنوان
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
  /me/addresses/{id}/default:
    put:
      tags: [Profile]
      summary: تعيين العنوان الافتراضي
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
  /devices:
    post:
      tags: [Profile]
      summary: تسجيل جهاز للإشعارات (FCM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceToken, platform]
              properties:
                deviceToken: { type: string }
                platform: { type: string, enum: [android, ios] }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
  /devices/{deviceToken}:
    delete:
      tags: [Profile]
      summary: إلغاء تسجيل جهاز
      parameters:
        - { name: deviceToken, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: '#/components/responses/Ok' }

  # ---------------- Notifications ----------------
  /notifications:
    # [NOT IMPLEMENTED] غير منفذ في الكود الحالي — لا يستخدمه الموبايل
    get:
      tags: [Notifications]
      summary: قائمة الإشعارات
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
  /notifications/unread-count:
    # [NOT IMPLEMENTED] غير منفذ في الكود الحالي — لا يستخدمه الموبايل
    get:
      tags: [Notifications]
      summary: عدد غير المقروء (نقطة الجرس)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count: { type: integer }
  /notifications/{id}/read:
    # [NOT IMPLEMENTED] غير منفذ في الكود الحالي — لا يستخدمه الموبايل
    put:
      tags: [Notifications]
      summary: تعليم إشعار كمقروء
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
  /notifications/read-all:
    # [NOT IMPLEMENTED] غير منفذ في الكود الحالي — لا يستخدمه الموبايل
    put:
      tags: [Notifications]
      summary: تعليم الكل كمقروء
      responses:
        "200": { $ref: '#/components/responses/Ok' }

  # ---------------- Deals (individual) ----------------
  /me/wallet:
    get:
      tags: [Wallet]
      summary: محفظتي — مقفولة بالكامل لحد التفعيل (الأرصدة null قبل التفعيل)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Wallet'
  /me/wallet/activate:
    post:
      tags: [Wallet]
      summary: تفعيل المحفظة (idempotent — التفعيل الثاني يرجع نفس المحفظة)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Wallet'
  /me/wallet/transactions:
    get:
      tags: [Wallet]
      summary: سجل عمليات المحفظة من دفتر الأستاذ (يتطلب التفعيل، وإلا 403 WALLET_NOT_ACTIVATED)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: OK (paged)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WalletTransaction'
  /me/wallet/withdrawals:
    get:
      tags: [Wallet]
      summary: طلبات السحب الخاصة بي (تتطلب التفعيل)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: OK (paged)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Withdrawal'
    post:
      tags: [Wallet]
      summary: طلب سحب للحساب البنكي المسجّل — يتطلب التفعيل وحساباً بنكياً، والمبلغ ≤ الرصيد المتاح بعد خصم الطلبات المعلّقة والموافق عليها
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, idempotencyKey]
              properties:
                amount: { type: number, description: 'أكبر من صفر، حتى 10,000,000، برقمين عشريين' }
                idempotencyKey: { type: string, description: 'إعادة نفس المفتاح ترجع نفس الطلب، لا طلباً ثانياً' }
      responses:
        "201":
          description: Created (pending)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Withdrawal'
  /admin/withdrawals:
    get:
      tags: [Wallet]
      summary: كل طلبات السحب (للمشغّلين فقط — user ids في إعداد wallet.operators، وإلا 403 WALLET_NOT_OPERATOR)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, processing, completed, rejected, failed] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: OK (paged)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WithdrawalAdmin'
  /admin/withdrawals/{id}/approve:
    post:
      tags: [Wallet]
      summary: موافقة مشغّل على طلب سحب معلّق (يعيد فحص الرصيد؛ ApprovedByAdminId يبقى null لأن مفتاحه الأجنبي يشير لهوية أدمن منفصلة في سايكل 9)
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Withdrawal'
  /admin/withdrawals/{id}/reject:
    post:
      tags: [Wallet]
      summary: رفض مشغّل لطلب سحب معلّق مع سبب
      parameters:
        - $ref: '#/components/parameters/DealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Withdrawal'
  /admin/withdrawals/{id}/complete:
    post:
      tags: [Wallet]
      summary: تأكيد التحويل البنكي اليدوي — هنا فقط يغادر المال المحفظة (Dr محفظة / Cr BankPayout) مع مرجع التحويل
      parameters:
        - $ref: '#/components/parameters/DealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankReference]
              properties:
                bankReference: { type: string, maxLength: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Withdrawal'
  /users/lookup:
    get:
      tags: [Deals]
      summary: البحث عن بائع بالجوال أو الكود قبل إنشاء المعاملة
      description: |
        بحث دقيق (exact) بالجوال السعودي أو الكود العام فقط — نفس مطابقة أمر
        الإنشاء — وليس بحثا جزئيا، حتى لا يمكن تعداد الحسابات. المتصل نفسه
        مستثنى (404). الرد لا يحتوي جوال ولا بريد، فقط ما يلزم للتأكد
        من هوية البائع قبل الإنشاء، بالإضافة إلى sellerId لربط المعاينة
        بصفحة المتجر.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Counterparty' }
        "404": { $ref: '#/components/responses/NotFound' }
  /deals:
    post:
      tags: [Deals]
      summary: إنشاء معاملة جديدة (المشتري)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, sellerPhoneOrCode, description, amount, durationValue, durationUnit, needShipping, acceptTerms]
              properties:
                title: { type: string, example: "iPhone 18 Pro Max 1T" }
                sellerPhoneOrCode: { type: string }
                description: { type: string, maxLength: 200 }
                amount: { type: number, example: 6200 }
                durationValue: { type: integer, example: 5 }
                durationUnit: { type: string, enum: [hour, day] }
                needShipping: { type: boolean }
                shippingCompanyId: { type: integer, nullable: true, description: مطلوب إذا needShipping=true }
                shippingAddressId: { type: integer, nullable: true }
                acceptTerms: { type: boolean }
                imagePublicId: { type: string, format: uuid, nullable: true, description: 'المعرّف العام للصورة المرفوعة عبر POST /uploads بقيمة deal_image (اختياري). يجب أن تكون الصورة ملك المشتري ونوعها deal_image، وإلا فشل الإنشاء بـ INVALID_VALUE.' }
      responses:
        "201":
          description: تم الإرسال (شاشة deal sent)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Deal' }
        "422": { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Deals]
      summary: قائمة المعاملات
      parameters:
        - { name: role, in: query, required: true, schema: { type: string, enum: [buyer, seller] } }
        - { name: tab, in: query, required: false, schema: { type: string, enum: [new, in_progress, completed] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/DealSummary' } }
  /deals/{id}:
    get:
      tags: [Deals]
      summary: تفاصيل المعاملة (كل حالات الشاشات تعتمد على status + availableActions؛ الـ Timeline مدمجة في الرد)
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Deal' }
        "404": { $ref: '#/components/responses/NotFound' }
  /deals/{id}/accept:
    post:
      tags: [Deals]
      summary: قبول المعاملة (البائع فقط) مع الموافقة على الشروط
      parameters:
        - $ref: '#/components/parameters/DealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptTerms]
              properties:
                acceptTerms: { type: boolean }
      responses:
        "200": { $ref: '#/components/responses/DealResult' }
        "409": { $ref: '#/components/responses/Conflict' }
  /deals/{id}/reject:
    post:
      tags: [Deals]
      summary: رفض المعاملة مع السبب
      parameters:
        - $ref: '#/components/parameters/DealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonId]
              properties:
                reasonId: { type: integer }
                note: { type: string, maxLength: 200, description: مطلوب عند اختيار سبب آخر }
      responses:
        "200": { $ref: '#/components/responses/DealResult' }
        "409": { $ref: '#/components/responses/Conflict' }
  /deals/{id}/cancel:
    post:
      tags: [Deals]
      summary: إلغاء المعاملة (أي طرف، قبل تحرك أي مال فقط)
      description: |
        مسموح في pending_acceptance و awaiting_funding فقط. بعد التمويل يرفض
        بـ DEAL_INVALID_STATE. أي تعديل معلق على المعاملة يلغى معها.
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        "200": { $ref: '#/components/responses/DealResult' }
        "409": { $ref: '#/components/responses/Conflict' }
  /deals/{id}/edits:
    post:
      tags: [Deals]
      summary: اقتراح تعديل (القيمة أو المدة أو التفاصيل) — قبل القبول فقط
      description: |
        على الأقل حقل واحد يجب أن يتغير، وحقل واحد معلق فقط لكل معاملة
        (الثاني يرفض بـ DEAL_EDIT_ALREADY_PENDING). القبول الأصلي محظور أثناء
        وجود تعديل معلق. عند الموافقة تطبق القيم الجديدة على المعاملة وتبقى
        pending_acceptance؛ مهلة الرد لا تتمدد. التفاصيل الكاملة للاقتراح المعلق
        في pendingEdit داخل GET /deals/{id}.
      parameters:
        - $ref: '#/components/parameters/DealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number }
                durationValue: { type: integer }
                durationUnit: { type: string, enum: [hour, day] }
                description: { type: string, maxLength: 200 }
      responses:
        "201":
          description: اقتراح تعديل أنشئ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DealEdit' }
        "409": { $ref: '#/components/responses/Conflict' }
  /deals/{id}/edits/{editId}/approve:
    post:
      tags: [Deals]
      summary: الموافقة على التعديل (الطرف الآخر فقط، قبل انتهاء مهلة الرد)
      parameters:
        - $ref: '#/components/parameters/DealId'
        - { name: editId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: '#/components/responses/DealResult' }
  /deals/{id}/edits/{editId}/reject:
    post:
      tags: [Deals]
      summary: رفض التعديل (الطرف الآخر فقط)
      parameters:
        - $ref: '#/components/parameters/DealId'
        - { name: editId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: '#/components/responses/DealResult' }
  /deals/{id}/edits/{editId}/cancel:
    post:
      tags: [Deals]
      summary: إلغاء اقتراح التعديل (المقترح نفسه فقط)
      parameters:
        - $ref: '#/components/parameters/DealId'
        - { name: editId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: '#/components/responses/DealResult' }
  /deals/{id}/fund:
    post:
      tags: [Deals]
      summary: تمويل المعاملة — بدء جلسة دفع (المشتري فقط، من awaiting_funding فقط)
      description: |
        لا يوجد body. مفتاح Idempotency إجباري في الهيدر (X-Idempotency-Key أو
        Idempotency-Key، حتى 64 حرفا). إعادة الإرسال بنفس المفتاح ونفس الطلب
        ترجع نفس الجلسة؛ نفس المفتاح لصفقة أخرى يرفض بـ IDEMPOTENCY_KEY_REUSED.
        المزود الحالي Fake فقط ولا يحرك مالا حقيقيا؛ طريقة الدفع ثابتة
        BankTransfer في الكود الحالي. إكمال الدفع في التطوير فقط عبر
        POST /payments/dev/deals/{id}/complete (غير موجود في هذا العقد عمدا
        لأنه dev-only)، ثم يعالج webhook النجاح ويحجز المبلغ في الضمان.
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          description: جلسة دفع بدأت
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FundSession' }
        "409": { $ref: '#/components/responses/Conflict' }
  /deals/{id}/deliver:
    post:
      tags: [Deals]
      summary: تسليم المعاملة (البائع فقط، من funded فقط)
      description: |
        ينقل الصفقة فورا إلى inspection ويبدأ نافذة الفحص (نافذة الفحص = مدة
        الصفقة نفسها، وليست إعدادا مستقلا). لصفقة شحن، ينشئ سجل Shipment:
        رقم تتبع يدوي اختياري (trackingNumber، حتى 60 حرفا) يجعل حالة
        الشحنة in_transit، وبدونه تكون created. رقم تتبع على صفقة بلا شحن
        مرفوض بـ INVALID_VALUE. الـ body اختياري — عملاء قدامى يرسلون body
        فارغا ما زالوا يعملون.
      parameters:
        - $ref: '#/components/parameters/DealId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                trackingNumber: { type: string, nullable: true, description: رقم تتبع شركة الشحن، لصفقات الشحن فقط }
      responses:
        "200": { $ref: '#/components/responses/DealResult' }
  /deals/{id}/tracking:
    get:
      tags: [Deals]
      summary: تتبع الشحنة (طرفا الصفقة فقط)
      description: |
        يعيد شحنة الصفقة إن وجدت: رقم التتبع اليدوي وحالة الشحنة
        (created بدون رقم تتبع، in_transit برقم تتبع) وأحداث الشحنة
        (فارغة في التتبع اليدوي v1 — الأحداث تأتي مع تكامل شركة شحن
        مستقبلي). صفقة بلا شحن أو بلا شحنة تعيد حقولا null وقائمة
        أحداث فارغة، لا 404. غير الطرفين يأخذ 404.
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          dealId: { type: integer }
                          trackingNumber: { type: string, nullable: true }
                          shipmentStatus: { type: string, nullable: true, enum: [created, picked_up, in_transit, out_for_delivery, delivered, failed, returned] }
                          shippingCompanyNameAr: { type: string, nullable: true }
                          shippingCompanyNameEn: { type: string, nullable: true }
                          events:
                            type: array
                            items:
                              type: object
                              properties:
                                code: { type: string }
                                description: { type: string }
                                location: { type: string, nullable: true }
                                at: { type: string, format: date-time }
  /deals/{id}/release:
    post:
      tags: [Deals]
      summary: تأكيد الاستلام والإفراج (المشتري فقط، من inspection فقط)
      description: |
        مفتاح Idempotency إجباري في الهيدر. الإفراج اليدوي هنا، والإفراج
        التلقائي يتم من الخادم بعد InspectionEndsAt. الصفقة المتنازع عليها لا
        يفرج عنها. يرجع { dealId, status, amount, feeAmount, sellerNetAmount }.
      parameters:
        - $ref: '#/components/parameters/DealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReleaseResult' }
        "409": { $ref: '#/components/responses/Conflict' }
  /deals/{id}/not-received:
    post:
      tags: [Deals]
      summary: '[NOT IMPLEMENTED] لم أستلم — لا يوجد endpoint؛ البديل الحالي هو فتح نزاع أثناء الفحص'
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        "200": { $ref: '#/components/responses/DealResult' }
  /deals/{id}/rating:
    post:
      tags: [Deals]
      summary: '[NOT IMPLEMENTED] تقييم المتجر — كيان فقط، لا يوجد endpoint'
      parameters:
        - $ref: '#/components/parameters/DealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 300, nullable: true }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
        "409": { $ref: '#/components/responses/Conflict' }
  /deals/{id}/timeline:
    get:
      tags: [Deals]
      summary: '[NOT IMPLEMENTED] سجل مستقل — الـ Timeline مدمجة داخل GET /deals/{id} في الكود الحالي'
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            status: { $ref: '#/components/schemas/DealStatus' }
                            label: { type: string }
                            at: { type: string, format: date-time }
  /deals/{id}/dispute:
    post:
      tags: [Deals]
      summary: فتح نزاع (أي طرف، يجمد الضمان)
      description: |
        يرجع 201 مع { id, number, dealId, status } حيث number بصيغة DSP-{dealId}.
        لا يقبل fileIds ولا confirmed في الكود الحالي. فتح النزاع يجمّد الضمان
        ويمنع الإفراج التلقائي؛ لا توجد بعد رسائل نزاع ولا قرار أدمن ولا استرداد.
      parameters:
        - $ref: '#/components/parameters/DealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonId, details]
              properties:
                reasonId: { type: integer, description: من lookups نوع dispute_reason ونشط }
                details: { type: string, maxLength: 200 }
      responses:
        "201":
          description: نزاع مفتوح
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DisputeResult' }
        "409": { $ref: '#/components/responses/Conflict' }
  /sellers/{id}/store:
    get:
      tags: [Deals]
      summary: صفحة المتجر العامة (أي مستخدم مسجل دخول)
      description: |
        تعرض كل حاجة ما عدا صفقات البائع: البانر والاسم والتصنيف والتقييم
        وعدد الصفقات الناجحة. بائع بلا ملف متجر يرجع صفحة افتراضية (اسم
        حسابه وتقييم صفر) بدل 404؛ بائع غير موجود فقط هو 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sellerId: { type: integer }
                          sellerName: { type: string }
                          storeName: { type: string, nullable: true }
                          categoryId: { type: integer, nullable: true }
                          category: { type: string, nullable: true }
                          bannerUrl: { type: string, nullable: true }
                          ratingAvg: { type: number }
                          ratingCount: { type: integer }
                          successfulDeals: { type: integer }
  /sellers/{id}/reviews:
    get:
      tags: [Deals]
      summary: تقييمات المتجر (الظاهرة فقط، بلا بيانات خاصة)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Review' } }
  /products:
    get:
      tags: [Deals]
      summary: صفحة التسوق — كل منتجات كل البائعين، بالأحدث
      description: |
        تغذية الاكتشاف: أي مستخدم مسجل دخول يشوف كل المنتجات مع البائع
        والمتجر التابع لها، لفتح صفحة المتجر منها. بلا بحث في المرحلة دي.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ShopProduct' } }
  /sellers/{id}/products:
    get:
      tags: [Deals]
      summary: منتجات المتجر (للعرض فقط، لا تبدأ صفقات)
      description: |
        كتالوج البائع المعروض في صفحة متجره، مرتب بالأحدث. بائع غير موجود
        هو 404؛ يتطلب تسجيل دخول مثل باقي صفحة المتجر.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Product' } }
  /me/products:
    get:
      tags: [Deals]
      summary: منتجاتي (إدارة كتالوج البائع)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
