          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Dispute' }
  /disputes/{id}/messages:
    # [NOT IMPLEMENTED] غير منفذ في الكود الحالي — لا يستخدمه الموبايل
    post:
      tags: [Disputes]
      summary: إضافة رسالة أو مستندات للنزاع
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
                fileIds: { type: array, items: { type: string } }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
  /support/faqs:
    get:
      tags: [Support]
      summary: الأسئلة الشائعة
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            question: { type: string }
                            answer: { type: string }
  /support/contact:
    # [NOT IMPLEMENTED] غير منفذ في الكود الحالي — لا يستخدمه الموبايل
    post:
      tags: [Support]
