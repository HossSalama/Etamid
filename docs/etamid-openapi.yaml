      responses:
        "200": { $ref: '#/components/responses/Ok' }
  /company/deals/{id}/contract:
    # [NOT IMPLEMENTED] غير منفذ في الكود الحالي — لا يستخدمه الموبايل
    get:
      tags: [Company]
      summary: رابط عقد المعاملة (مؤقت)
      parameters:
        - $ref: '#/components/parameters/DealId'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url: { type: string }
                          expiresAt: { type: string, format: date-time }
  /company/payments/upcoming:
    # [NOT IMPLEMENTED] غير منفذ في الكود الحالي — لا يستخدمه الموبايل
    get:
      tags: [Company]
      summary: الدفعات القادمة (عرض الكل)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/UpcomingPayment' } }
  /company/payments/{id}:
    # [NOT IMPLEMENTED] غير منفذ في الكود الحالي — لا يستخدمه الموبايل
    get:
      tags: [Company]
      summary: تفاصيل دفعة (شاشة اعتماد الدفعة)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PaymentInstallment' }
  /company/payments/{id}/approve:
    # [NOT IMPLEMENTED] غير منفذ في الكود الحالي — لا يستخدمه الموبايل
    post:
      tags: [Company]
      summary: اعتماد الدفعة
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: '#/components/responses/Ok' }
        "409": { $ref: '#/components/responses/Conflict' }
  /company/payments/{id}/reject:
    # [NOT IMPLEMENTED] غير منفذ في الكود الحالي — لا يستخدمه الموبايل
    post:
      tags: [Company]
      summary: رفض الدفعة مع السبب
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        "200": { $ref: '#/components/responses/Ok' }

  # ---------------- Webhooks ----------------
  /payments/webhook:
    post:
      tags: [Wallet]
      summary: (للـ Backend فقط) إشعار بوابة الدفع. لا يستخدمه الموبايل
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page: { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
    DealId: { name: id, in: path, required: true, schema: { type: integer } }
    DraftId: { name: draftId, in: path, required: true, schema: { type: integer } }
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: مفتاح يولّده الموبايل لكل عملية مالية (غير فارغ، حتى 64 حرفا، وليس بالضرورة UUID) لمنع التكرار عند إعادة المحاولة. يقبل الكود أيضا هيدر Idempotency-Key كبديل.
      schema: { type: string, maxLength: 64 }
  responses:
    Ok:
      description: نجاح بدون بيانات
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { success: true, message: "تمت العملية بنجاح", data: null, errors: [] }
    OtpSent:
      description: تم إرسال الكود
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      phone: { type: string }
                      resendAfterSeconds: { type: integer, example: 56 }
                      expiresInSeconds: { type: integer, example: 300 }
    AuthTokens:
      description: توكنات الدخول
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthData' }
    DealResult:
      description: المعاملة بعد الإجراء
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Deal' }
    Unauthorized:
      description: UNAUTHORIZED / TOKEN_EXPIRED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { success: false, message: "انتهت الجلسة", data: null, errors: [{ code: "TOKEN_EXPIRED", message: "انتهت الجلسة" }] }
    NotFound:
      description: NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Conflict:
      description: تعارض (مثل PHONE_EXISTS أو INVALID_DEAL_STATE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    ValidationError:
      description: أخطاء التحقق، كل خطأ مع الحقل
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            success: false
            message: "بيانات غير صحيحة"
            data: null
            errors: [{ code: "REQUIRED", field: "phone", message: "رقم الجوال مطلوب" }]
    TooManyRequests:
      description: TOO_MANY_REQUESTS (هيدر Retry-After بالثواني)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }

  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { nullable: true }
        errors: { type: array, items: { $ref: '#/components/schemas/ApiError' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    ApiError:
      type: object
      properties:
        code: { type: string, example: "INVALID_CREDENTIALS" }
        field: { type: string, nullable: true }
        message: { type: string }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    AppConfig:
      type: object
      properties:
        languages: { type: array, items: { type: string }, example: [ar, en] }
        minVersion: { type: object, properties: { android: { type: string }, ios: { type: string } } }
        forceUpdate: { type: boolean }
        supportWhatsapp: { type: string }
        currency: { type: string, example: SAR }
    LookupItem:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        iconUrl: { type: string, nullable: true }
    Terms:
      type: object
      properties:
        version: { type: string }
        title: { type: string }
        items: { type: array, items: { type: string } }
    AuthData:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresInSeconds: { type: integer, example: 3600 }
        user: { $ref: '#/components/schemas/Profile' }
    Profile:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, description: كود المستخدم للبحث }
        type: { type: string, enum: [individual, company] }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        avatarUrl: { type: string, nullable: true }
        language: { type: string, enum: [ar, en] }
        phoneVerified: { type: boolean }
        nafathVerified: { type: boolean }
        walletActivated: { type: boolean }
        bankAccount: { $ref: '#/components/schemas/BankAccount' }
        company:
          type: object
          nullable: true
          properties:
            commercialRegNo: { type: string }
            taxNo: { type: string, nullable: true }
    BankAccount:
      type: object
      nullable: true
      properties:
        holderName: { type: string }
        ibanMasked: { type: string, example: "SA•••••••••4582" }
        bankName: { type: string, example: "مصرف الراجحي" }
        bankLogoUrl: { type: string }
    Home:
      type: object
      properties:
        accountType: { type: string, enum: [guest, individual, company] }
        unreadNotifications: { type: integer }
        wallet: { $ref: '#/components/schemas/Wallet' }
        activeDeals: { type: array, items: { $ref: '#/components/schemas/DealSummary' } }
        activeDealsCount: { type: integer }
        company: { $ref: '#/components/schemas/CompanyDashboard' }
    Notification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [deal_request, deal_accepted, deal_rejected, deal_edit, deal_funded, deal_shipped, deal_delivered, dispute_update, payment_approval, payment_due, penalty, wallet, system] }
        title: { type: string }
        body: { type: string }
        isRead: { type: boolean }
        dealId: { type: integer, nullable: true }
        paymentId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
    Counterparty:
      type: object
      description: كما يرجعه GET /users/lookup. لا يحتوي جوال ولا بريد عمدا؛ sellerId موجود لربط المعاينة بصفحة المتجر.
      properties:
        name: { type: string }
        code: { type: string }
        storeName: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        emailVerified: { type: boolean }
        nafathVerified: { type: boolean }
        rating: { type: number }
        successfulDeals: { type: integer }
        sellerId: { type: integer }
    DealStatus:
      type: string
      description: الحالات الفعلية فقط (snake_case). القيم القديمة draft/pending_seller/accepted/shipped/delivered/completed غير موجودة في الكود.
      enum: [pending_acceptance, awaiting_funding, funded, in_delivery, inspection, released, rejected, cancelled, expired, disputed, refund_pending, refunded]
    DealAction:
      type: string
      description: |
        الأفعال الفعلية فقط، كما ينتجها DealActions.For في الكود:
        pending_acceptance: seller accept/reject, either party propose_edit/cancel;
        pending_acceptance with open edit: proposer cancel_edit, other party approve_edit/reject_edit |
        awaiting_funding: buyer fund, either party cancel |
        funded+seller: deliver | inspection+buyer: release, dispute (dispute فقط
        ما دام now <= inspectionEndsAt). أي فعل آخر غير موجود في الردود الفعلية.
      enum: [accept, reject, cancel, propose_edit, approve_edit, reject_edit, cancel_edit, fund, deliver, release, dispute]
    Badge:
      type: object
      description: الشارة الزمنية (3 أيام = أصفر، 6 ساعات = أحمر)
      properties:
        text: { type: string, example: "متبقي 3 أيام" }
        color: { type: string, enum: [yellow, red, green, grey] }
        remainingSeconds: { type: integer }
    DealSummary:
      type: object
      description: كما يرجعه DealSummaryDto الفعلي. imageUrl هو رابط صورة المنتج أو null عند عدم وجود صورة.
      properties:
        id: { type: integer }
        number: { type: integer, example: 45872 }
        title: { type: string }
        amount: { type: number }
        currency: { type: string, example: SAR }
        status: { $ref: '#/components/schemas/DealStatus' }
        role: { type: string, enum: [buyer, seller] }
        counterpartyName: { type: string }
        counterpartyCode: { type: string }
        createdAt: { type: string, format: date-time }
        availableActions: { type: array, items: { $ref: '#/components/schemas/DealAction' } }
        imageUrl: { type: string, nullable: true, description: رابط صورة المنتج، أو null }
        needShipping: { type: boolean }
        shippingCompanyNameAr: { type: string, nullable: true }
        shippingCompanyNameEn: { type: string, nullable: true }
        shippingAddressText: { type: string, nullable: true, description: نص عنوان التوصيل المجمّد وقت إنشاء الصفقة }
        trackingNumber: { type: string, nullable: true }
        shipmentStatus: { type: string, nullable: true }
        counterpartyId: { type: integer, nullable: true, description: id الطرف الآخر، لربط كارت الصفقة بصفحة متجره }
    Deal:
      type: object
      description: |
        كما يرجعه DealDetailDto الفعلي (مسطح، وليس متداخلا). لا يوجد counterparty
        ككائن ولا shipping ككائن ولا paymentMethod ولا fundsHeld
        ولا pendingEdit ولا rejection ولا banner ولا rated ولا dispute ككائن في
        الرد الفعلي — فقط isDisputed (bool) و timeline مدمجة و contractHash.
        ملاحظة: ShippedAt غير معروض؛ المعروض هو deliveredAt فقط، و deliver()
        ينقل الصفقة مباشرة إلى inspection.
      properties:
        id: { type: integer }
        number: { type: integer, example: 45872 }
        title: { type: string }
        description: { type: string }
        amount: { type: number }
        currency: { type: string, example: SAR }
        status: { $ref: '#/components/schemas/DealStatus' }
        role: { type: string, enum: [buyer, seller] }
        counterpartyName: { type: string }
        counterpartyCode: { type: string }
        durationValue: { type: integer }
        durationUnit: { type: string, enum: [hour, day] }
        needShipping: { type: boolean }
        shippingCompanyId: { type: integer, nullable: true }
        shippingAddressId: { type: integer, nullable: true }
        feeAmount: { type: number, nullable: true }
        sellerNetAmount: { type: number, nullable: true }
        isDisputed: { type: boolean }
        createdAt: { type: string, format: date-time }
        respondDeadlineAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time, nullable: true }
        fundedAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        inspectionEndsAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        contractHash: { type: string, nullable: true, description: SHA-256 لعقد القبول المجمّد }
        pendingEdit: { $ref: '#/components/schemas/DealEdit', description: الاقتراح المعلق الوحيد، أو null. يظهر فقط أثناء pending_acceptance. }
        availableActions: { type: array, items: { $ref: '#/components/schemas/DealAction' } }
        timeline:
          type: array
          items:
            type: object
            properties:
              from: { type: string, nullable: true }
              to: { type: string }
              actorType: { type: string }
              at: { type: string, format: date-time }
              note: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true, description: رابط صورة المنتج، أو null }
        shippingCompanyNameAr: { type: string, nullable: true }
        shippingCompanyNameEn: { type: string, nullable: true }
        shippingAddressText: { type: string, nullable: true, description: نص عنوان التوصيل المجمّد وقت إنشاء الصفقة }
        trackingNumber: { type: string, nullable: true }
        shipmentStatus: { type: string, nullable: true }
    FundSession:
      type: object
      description: كما يرجعه FundSessionDto من POST /deals/{id}/fund.
      properties:
        paymentId: { type: string, format: uuid }
        dealId: { type: integer }
        status: { type: string }
        amount: { type: number }
        currency: { type: string, example: SAR }
        provider: { type: string, example: Fake }
        providerPaymentId: { type: string }
        redirectUrl: { type: string }
    ReleaseResult:
      type: object
      description: كما يرجعه ReleaseResultDto من POST /deals/{id}/release.
      properties:
        dealId: { type: integer }
        status: { $ref: '#/components/schemas/DealStatus' }
        amount: { type: number }
        feeAmount: { type: number }
        sellerNetAmount: { type: number }
    DisputeResult:
      type: object
      description: كما يرجعه DisputeDto من POST /deals/{id}/dispute.
      properties:
        id: { type: integer }
        number: { type: string, example: "DSP-0045872" }
        dealId: { type: integer }
        status: { type: string, example: under_review }
    UpdateProfileResult:
      type: object
      description: كما يرجعه PUT /me بعد إصلاح إعادة التحقق من البريد.
      properties:
        emailChanged: { type: boolean }
        emailVerificationRequired: { type: boolean }
        otpSent: { type: boolean }
    DealEdit:
      type: object
      description: كما يرجعه DealEditDto. الحقول New* تكون null عندما لم يقترح تغيير ذلك الحقل.
      properties:
        id: { type: integer }
        dealId: { type: integer }
        proposedBy: { type: string, enum: [buyer, seller] }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        prevAmount: { type: number }
        prevDurationValue: { type: integer }
        prevDurationUnit: { type: string }
        prevDescription: { type: string }
        newAmount: { type: number, nullable: true }
        newDurationValue: { type: integer, nullable: true }
        newDurationUnit: { type: string, nullable: true }
        newDescription: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, nullable: true }
    Store:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string, example: "أجهزة إلكترونية" }
        bannerUrl: { type: string }
        rating: { type: number, example: 4.9 }
        successfulDeals: { type: integer, example: 345 }
    Review:
      type: object
      properties:
        id: { type: integer }
        reviewerName: { type: string }
        reviewerAvatarUrl: { type: string, nullable: true }
        verified: { type: boolean }
        stars: { type: integer }
        comment: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Product:
      type: object
      description: منتج في كتالوج البائع — للعرض فقط في المرحلة الحالية، لا يبدأ صفقة.
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: number, description: 'أكبر من صفر، حتى 10,000,000، برقمين عشريين' }
        quantity: { type: integer, description: 'المخزون المتاح، صفر يعني نفدت الكمية' }
        imageUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        imageFileId: { type: string, nullable: true, description: 'المعرّف العام لصورة المنتج، ليدور محرر المتجر على الصورة القديمة عند الحفظ' }
    ShopProduct:
      type: object
      description: منتج في صفحة التسوق مع بائعه ومتجره، لربط الكارت بصفحة المتجر.
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            sellerId: { type: integer }
            sellerName: { type: string }
            storeName: { type: string, nullable: true }
            sellerCode: { type: string, description: 'كود البائع العام، لفتح صفحة إنشاء صفقة منه' }
    ProductInput:
      type: object
      required: [name, price, quantity]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string, maxLength: 1000, nullable: true }
        price: { type: number }
        quantity: { type: integer, minimum: 0 }
        imagePublicId: { type: string, nullable: true, description: 'معرّف عام من /uploads بغرض product_image، ملك البائع وصورة فعلية' }
    Wallet:
      type: object
      description: محفظة المستخدم — الأرصدة null قبل التفعيل لأن المحفظة مقفولة بالكامل.
      properties:
        activated: { type: boolean }
        activatedAt: { type: string, format: date-time, nullable: true }
        availableBalance: { type: number, nullable: true }
        escrowHeld: { type: number, nullable: true, description: 'محسوب من الصفقات: مشتري موّل ولسه ما اتفرجتش، أو بائع مستني الإفراج؛ النزاع المجمد محسوب للطرفين، والاسترداد المعلق للمشتري فقط' }
        hasBankAccount: { type: boolean }
        bankAccountMasked: { type: string, nullable: true }
    WalletTransaction:
      type: object
      description: حركة واحدة على حساب المحفظة في دفتر الأستاذ.
      properties:
        id: { type: integer }
        type: { type: string, description: 'snake_case من LedgerTransactionType، مثل escrow_release و withdrawal' }
        direction: { type: string, enum: [credit, debit] }
        amount: { type: number }
        balanceAfter: { type: number, nullable: true }
        dealId: { type: integer, nullable: true }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Withdrawal:
      type: object
      properties:
        id: { type: integer }
        amount: { type: number }
        feeAmount: { type: number, description: 'صفر في v1 — لا رسوم' }
        ibanSnapshotMasked: { type: string, description: 'نسخة IBAN مجمدة وقت الطلب، لا تتغير لو عدّل المستخدم حسابه بعدها' }
        status: { type: string, enum: [pending, approved, processing, completed, rejected, failed] }
        rejectionReason: { type: string, nullable: true }
        bankReference: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        processedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    WithdrawalAdmin:
      type: object
      description: طلب سحب مع صاحبه، لقائمة المشغّل.
      allOf:
        - $ref: '#/components/schemas/Withdrawal'
        - type: object
          properties:
            userId: { type: integer }
            userName: { type: string }
    Wallet:
      type: object
      properties:
        activated: { type: boolean }
        balance: { type: number, example: 12450 }
        heldAmount: { type: number, description: المبالغ المحجوزة }
        currency: { type: string, example: SAR }
    WalletTransaction:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [paid, refund, release, withdrawal, topup, penalty] }
        amount: { type: number, description: موجب أو سالب }
