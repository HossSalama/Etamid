                    properties:
                      data: { $ref: '#/components/schemas/Product' }
    delete:
      tags: [Deals]
      summary: حذف منتج (حذف نهائي، مالكه فقط)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
  /me/products/import:
    post:
      tags: [Deals]
      summary: استيراد منتجات من شيت Excel
      description: |
        ملف .xlsx، ورقته الأولى بأعمدة: الاسم، الوصف، السعر، الكمية
        (وتُقبل الأسماء الإنجليزية name/description/price/quantity).
        الاستيراد كلي أو لا شيء: أي صف غلط يرفض الملف كله ولا يُحفظ
        شيء، والرد 422 بكود PRODUCT_IMPORT_FAILED وقائمة أخطاء الصفوف
        في extras.errors (رقم الصف في Excel، الحقل، الكود). حد أقصى 500 صف.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: OK — data.imported عدد المنتجات المستوردة
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          imported: { type: integer }
                          errors: { type: array, items: { type: object } }
        "422":
          description: ملف مرفوض — راجع extras.errors في أول خطأ
  /me/products/template:
    get:
      tags: [Deals]
      summary: تحميل تمبليت الاستيراد (ملف Excel)
      description: |
