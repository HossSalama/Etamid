    # [NOT IMPLEMENTED] غير منفذ في الكود الحالي — لا يستخدمه الموبايل
    get:
      tags: [Wallet]
      summary: سجل التحويلات
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
