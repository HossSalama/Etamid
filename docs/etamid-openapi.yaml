                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Dispute' } }
  /disputes/{id}:
    # [NOT IMPLEMENTED] غير منفذ في الكود الحالي — لا يستخدمه الموبايل
    get:
      tags: [Disputes]
