services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: src/Etamid.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${API_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=EtamidDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Security__DataKey: ${DATA_PROTECTION_KEY:?Set DATA_PROTECTION_KEY in .env}
      Auth__PhoneVerifier: Fake
      Nafath__Provider: Fake
      Database__ApplyMigrationsOnStart: "true"
      Storage__LocalPath: /app/storage
      Storage__PublicBaseUrl: ${API_PUBLIC_BASE_URL:-http://localhost:5080/files}
    volumes:
      - apistorage:/app/storage

volumes:
  sqldata:
  apistorage:
