<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>اعتمد — لوحة الإدارة</title>
    <!-- Without this, the browser resolves the app's relative asset URLs
         (main.js, styles.css) against the current page URL: it works at /
         and /login, but a hard refresh on a two-level route such as
         /users/individuals requests /users/main.js and /users/styles.css
         (404) and the app never loads — a blank white page. The website
         project has this line; the admin one was missing it. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="لوحة تحكم الإدارة لمنصة اعتمد — إدارة المعاملات والمستخدمين والإعدادات" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
